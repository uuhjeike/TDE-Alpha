<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>TDE Alpha</title>
<meta name="description" content="TDE Alpha — profile">
<link rel="preconnect" href="https://raw.githubusercontent.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* ============================================================
   TDE Alpha — tokens
   ============================================================ */
:root {
  --bg:            #0a0d10;
  --bg-grid:       #14202a;
  --panel:         #12161a;
  --panel-2:       #171c21;
  --line:          #262e35;
  --line-soft:     #1c2228;
  --steel:         #7b8894;
  --steel-bright:  #a9b6c1;
  --ink:           #e7eaed;
  --ink-dim:       #96a0a8;
  --ink-faint:     #5c666e;
  --accent:        #4f7f9c;
  --accent-dim:    #2f4a5a;

  --font-display: 'Archivo', system-ui, sans-serif;
  --font-body:    'Inter', system-ui, sans-serif;
  --font-mono:    'IBM Plex Mono', ui-monospace, monospace;

  --radius:  14px;
  --radius-sm: 8px;
  --shadow-card: 0 1px 2px rgba(0,0,0,.4), 0 12px 28px -14px rgba(0,0,0,.65);
  --stopwatch-h: 68px;
}

* { box-sizing: border-box; }

html {
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(ellipse 900px 500px at 50% -10%, rgba(79,127,156,.10), transparent 60%),
    var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  padding-bottom: calc(var(--stopwatch-h) + 28px);
}

/* Fixed blueprint grid + drafting corner marks, applied to the whole viewport */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-image:
    linear-gradient(var(--bg-grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--bg-grid) 1px, transparent 1px),
    linear-gradient(var(--bg-grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--bg-grid) 1px, transparent 1px);
  background-size: 88px 88px, 88px 88px, 22px 22px, 22px 22px;
  background-position: -1px -1px;
  opacity: .28;
  mask-image: radial-gradient(ellipse 900px 700px at 50% 0%, black, transparent 78%);
  -webkit-mask-image: radial-gradient(ellipse 900px 700px at 50% 0%, black, transparent 78%);
}

.page {
  position: relative;
  z-index: 1;
  max-width: 560px;
  margin: 0 auto;
  padding: 56px 18px 40px;
}

::selection { background: var(--accent-dim); color: var(--ink); }

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* ============================================================
   Profile
   ============================================================ */
.profile {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  margin-bottom: 44px;
}

.profile__photo-frame {
  position: relative;
  width: 132px;
  height: 132px;
  border-radius: 50%;
  padding: 3px;
  background: linear-gradient(155deg, #4a5761 0%, #23282d 45%, #4a5761 100%);
  box-shadow:
    0 0 0 1px rgba(255,255,255,.03),
    0 18px 40px -14px rgba(0,0,0,.75);
}

.profile__photo-frame::after {
  /* engineering tick — small crosshair accent, bottom-right of the ring */
  content: "";
  position: absolute;
  right: -3px;
  bottom: 6px;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 0 3px var(--bg), 0 0 10px 1px rgba(79,127,156,.6);
}

.profile__photo {
  display: block;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  object-fit: cover;
  background: var(--panel-2);
}

.profile__photo-frame--fallback .profile__photo {
  opacity: 0;
}
.profile__photo-frame--fallback::before {
  content: "TDE";
  position: absolute;
  inset: 3px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 13px;
  letter-spacing: .08em;
  color: var(--ink-dim);
  background: var(--panel-2);
}

.profile__name {
  margin: 18px 0 0;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: clamp(1.5rem, 5vw, 1.85rem);
  letter-spacing: -0.01em;
  color: var(--ink);
}

/* ============================================================
   Feed / posts
   ============================================================ */
.feed {
  display: flex;
  flex-direction: column;
  gap: 22px;
}

.post {
  background: linear-gradient(180deg, var(--panel-2), var(--panel));
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow-card);
  overflow: hidden;
}

.post__body {
  padding: 18px 20px;
}

.post__date {
  display: block;
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--ink-faint);
  margin-bottom: 8px;
  letter-spacing: .02em;
}

.post__text {
  margin: 0;
  font-size: 15.5px;
  line-height: 1.6;
  color: var(--ink);
  white-space: pre-line;
}

.post__meta {
  margin: 10px 0 0;
  font-size: 13px;
  color: var(--ink-dim);
  border-top: 1px solid var(--line-soft);
  padding-top: 10px;
}

.post__media {
  display: grid;
  gap: 2px;
}

.post__media[data-count="1"] { grid-template-columns: 1fr; }
.post__media[data-count="2"] { grid-template-columns: 1fr 1fr; }
.post__media[data-count="3"],
.post__media[data-count="4"] { grid-template-columns: 1fr 1fr; }

.post__img-wrap {
  position: relative;
  width: 100%;
  aspect-ratio: 4 / 3;
  background: var(--panel-2);
  overflow: hidden;
}

.post__media[data-count="1"] .post__img-wrap {
  aspect-ratio: 16 / 11;
}

.post__img-wrap img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0;
  transition: opacity .45s ease;
}

.post__img-wrap img.is-loaded {
  opacity: 1;
}

/* lightweight shimmer placeholder while an image loads */
.post__img-wrap::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(100deg, var(--panel-2) 30%, #1d242a 50%, var(--panel-2) 70%);
  background-size: 200% 100%;
  animation: shimmer 1.7s ease-in-out infinite;
}

.post__img-wrap.is-loaded::before,
.post__img-wrap.is-failed::before {
  animation: none;
  background: none;
  content: none;
}

@keyframes shimmer {
  0%   { background-position: 140% 0; }
  100% { background-position: -40% 0; }
}

/* clean fallback for a failed image */
.post__img-wrap.is-failed {
  display: flex;
  align-items: center;
  justify-content: center;
}
.post__img-wrap.is-failed::after {
  content: "Image unavailable";
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--ink-faint);
  letter-spacing: .02em;
}

/* ============================================================
   Infinite stopwatch — fixed to the bottom of the page
   ============================================================ */
.stopwatch {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 10;
  height: var(--stopwatch-h);
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(180deg, #10151a 0%, #0b0e11 100%);
  border-top: 1px solid var(--line);
  box-shadow: 0 -16px 32px -18px rgba(0,0,0,.7);
  padding: 0 12px;
}

.stopwatch__inner {
  display: flex;
  align-items: baseline;
  gap: 8px;
  font-family: var(--font-mono);
  color: var(--steel-bright);
  max-width: 100%;
  overflow-x: auto;
  scrollbar-width: none;
}
.stopwatch__inner::-webkit-scrollbar { display: none; }

.stopwatch__seg {
  display: flex;
  align-items: baseline;
  gap: 5px;
  white-space: nowrap;
}

.stopwatch__seg span {
  font-size: 16px;
  font-weight: 600;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
}

.stopwatch__seg small {
  font-size: 10px;
  color: var(--ink-faint);
  font-weight: 400;
}

.stopwatch__sep {
  color: var(--ink-faint);
  font-size: 14px;
}

/* ============================================================
   Responsive
   ============================================================ */
@media (min-width: 640px) {
  .page { padding-top: 72px; }
  .profile__photo-frame { width: 152px; height: 152px; }
  .post__body { padding: 22px 26px; }
  .stopwatch__seg span { font-size: 17px; }
}

@media (max-width: 360px) {
  .stopwatch__inner { gap: 6px; }
  .stopwatch__sep { font-size: 12px; }
  .stopwatch__seg span { font-size: 14px; }
  .stopwatch__seg small { font-size: 9px; }
}

@media (prefers-reduced-motion: reduce) {
  .post__img-wrap::before { animation: none; background: var(--panel-2); }
  .post__img-wrap img { transition: none; }
}

</style>
</head>
<body>

<main class="page">

  <!-- Profile -->
  <section class="profile" aria-label="Profile">
    <div class="profile__photo-frame">
      <img
        class="profile__photo"
        src="https://raw.githubusercontent.com/uuhjeike/TDE-Alpha/main/FB_IMG_1789464542803.jpg"
        alt="TDE Alpha profile photo"
        width="176"
        height="176"
        fetchpriority="high"
        decoding="async"
        onerror="this.closest('.profile__photo-frame').classList.add('profile__photo-frame--fallback')"
      >
    </div>
    <h1 class="profile__name">TDE Alpha</h1>
  </section>

  <!-- Feed -->
  <section class="feed" id="feed" aria-label="Posts">
    <!-- posts are rendered here by script.js -->
  </section>

</main>

<!-- Infinite stopwatch — fixed to the bottom of the page -->
<footer class="stopwatch" id="stopwatch" aria-label="Elapsed time counter">
  <div class="stopwatch__inner">
    <span class="stopwatch__seg"><span id="sw-days">000000</span><small>Days</small></span>
    <span class="stopwatch__sep">:</span>
    <span class="stopwatch__seg"><span id="sw-hours">00</span><small>Hours</small></span>
    <span class="stopwatch__sep">:</span>
    <span class="stopwatch__seg"><span id="sw-minutes">00</span><small>Minutes</small></span>
    <span class="stopwatch__sep">:</span>
    <span class="stopwatch__seg"><span id="sw-seconds">00</span><small>Seconds</small></span>
  </div>
</footer>

<script>
/* ============================================================
   POST DATA
   ------------------------------------------------------------
   Add future posts by adding another object to this array.
   Newest post should be placed first.

   Fields:
     text   (string, optional)  — post text. Omit or "" to skip.
     images (array,  optional)  — one or more image URLs. [] or
                                   omit for a text-only post.
     date   (string, optional)  — shown above the text, e.g. "12 Sep 2026".
     meta   (string, optional)  — small extra line under the post.

   Example of a future post:
   {
     date: "5 Oct 2026",
     text: "Post text here.",
     images: ["https://raw.githubusercontent.com/.../photo.jpg"]
   }
   ============================================================ */
const POSTS = [
  {
    text: "23 tarike class."
  }
];

/* ============================================================
   RENDER FEED
   ============================================================ */
const feedEl = document.getElementById('feed');

function renderPosts(posts) {
  const frag = document.createDocumentFragment();

  posts.forEach((post, index) => {
    const card = document.createElement('article');
    card.className = 'post';

    const body = document.createElement('div');
    body.className = 'post__body';

    if (post.date) {
      const date = document.createElement('span');
      date.className = 'post__date';
      date.textContent = post.date;
      body.appendChild(date);
    }

    if (post.text) {
      const text = document.createElement('p');
      text.className = 'post__text';
      text.textContent = post.text;
      body.appendChild(text);
    }

    if (post.meta) {
      const meta = document.createElement('p');
      meta.className = 'post__meta';
      meta.textContent = post.meta;
      body.appendChild(meta);
    }

    // Only attach the body if it actually has content.
    if (body.childNodes.length) {
      card.appendChild(body);
    }

    if (post.images && post.images.length) {
      const media = document.createElement('div');
      media.className = 'post__media';
      media.dataset.count = String(Math.min(post.images.length, 4));

      post.images.forEach((src, imgIndex) => {
        const wrap = document.createElement('div');
        wrap.className = 'post__img-wrap';

        const img = document.createElement('img');
        img.alt = post.text ? `Photo for: ${post.text}` : 'TDE Alpha post photo';
        img.decoding = 'async';

        // Feed's very first image loads immediately; everything else
        // is deferred until it approaches the viewport.
        const isFirstFeedImage = index === 0 && imgIndex === 0;

        if (isFirstFeedImage) {
          img.loading = 'eager';
          img.fetchPriority = 'high';
          img.src = src;
        } else {
          img.loading = 'lazy';
          img.dataset.src = src;
        }

        img.addEventListener('load', () => wrap.classList.add('is-loaded'));
        img.addEventListener('error', () => wrap.classList.add('is-failed'));

        wrap.appendChild(img);
        media.appendChild(wrap);
      });

      card.appendChild(media);
    }

    frag.appendChild(card);
  });

  feedEl.appendChild(frag);
}

renderPosts(POSTS);

/* ============================================================
   PROGRESSIVE IMAGE LOADING
   Images below the fold stay unloaded until they approach the
   viewport, so nothing downloads before it's needed.
   ============================================================ */
if ('IntersectionObserver' in window) {
  const observer = new IntersectionObserver((entries, obs) => {
    entries.forEach(entry => {
      if (!entry.isIntersecting) return;
      const img = entry.target;
      const src = img.dataset.src;
      if (src) {
        img.src = src;
        img.removeAttribute('data-src');
      }
      obs.unobserve(img);
    });
  }, {
    root: null,
    rootMargin: '400px 0px', // start loading well before it's visible
    threshold: 0.01
  });

  document.querySelectorAll('.post__img-wrap img[data-src]').forEach(img => {
    observer.observe(img);
  });
} else {
  // Fallback: load everything if IntersectionObserver isn't supported.
  document.querySelectorAll('.post__img-wrap img[data-src]').forEach(img => {
    img.src = img.dataset.src;
    img.removeAttribute('data-src');
  });
}

/* ============================================================
   INFINITE STOPWATCH — Bangladesh Standard Time (Asia/Dhaka, UTC+6)
   ------------------------------------------------------------
   Recalculated from a fixed start timestamp on every tick, so
   browser timer throttling (background tabs, inactive screens)
   never causes drift — the moment the tab wakes up, the display
   catches up correctly because it's always derived from real
   elapsed milliseconds, not accumulated ticks.
   ============================================================ */
const STOPWATCH_START = new Date('2026-09-15T00:00:00+06:00').getTime();

const swDays = document.getElementById('sw-days');
const swHours = document.getElementById('sw-hours');
const swMinutes = document.getElementById('sw-minutes');
const swSeconds = document.getElementById('sw-seconds');

function pad(num, len) {
  return String(num).padStart(len, '0');
}

function updateStopwatch() {
  const now = Date.now();
  let elapsed = now - STOPWATCH_START;
  if (elapsed < 0) elapsed = 0; // safety guard, never goes negative

  const SEC = 1000;
  const MIN = 60 * SEC;
  const HOUR = 60 * MIN;
  const DAY = 24 * HOUR;

  const days = Math.floor(elapsed / DAY);
  const hours = Math.floor((elapsed % DAY) / HOUR);
  const minutes = Math.floor((elapsed % HOUR) / MIN);
  const seconds = Math.floor((elapsed % MIN) / SEC);

  swDays.textContent = pad(days, 6);
  swHours.textContent = pad(hours, 2);
  swMinutes.textContent = pad(minutes, 2);
  swSeconds.textContent = pad(seconds, 2);
}

updateStopwatch();
setInterval(updateStopwatch, 1000);

// Recalculate immediately whenever the tab regains focus/visibility,
// so throttled background timers never leave a stale display.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') updateStopwatch();
});
window.addEventListener('focus', updateStopwatch);
window.addEventListener('pageshow', updateStopwatch);

</script>
</body>
</html>
